name: fonsat
x-database-env: &database-env
  DATABASE_URL: postgresql://fonsat_app:${APP_DB_PASSWORD:-fonsat_app_local_only}@db:5432/fonsat
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: fonsat
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fonsat_local_only}
      POSTGRES_DB: fonsat
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:-fonsat_app_local_only}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    ports: ["127.0.0.1:${DB_PORT:-5433}:5432"]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U fonsat -d fonsat"]
      interval: 2s
      timeout: 3s
      retries: 30
  setup:
    build: { context: ., target: api }
    environment:
      <<: *database-env
      ADMIN_DATABASE_URL: postgresql://fonsat:${POSTGRES_PASSWORD:-fonsat_local_only}@db:5432/fonsat
    command: sh -c 'npm run db:migrate && npm run db:seed'
    depends_on:
      db: { condition: service_healthy }
  api:
    build: { context: ., target: api }
    environment: *database-env
    ports: ["127.0.0.1:${API_PORT:-3001}:3001"]
    depends_on:
      setup: { condition: service_completed_successfully }
    healthcheck:
      test:
        [
          CMD,
          node,
          -e,
          "fetch('http://localhost:3001/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 3s
      timeout: 3s
      retries: 20
  web:
    build: { context: ., target: web }
    ports: ["127.0.0.1:${WEB_PORT:-3000}:3000"]
    depends_on:
      api: { condition: service_healthy }
volumes:
  pgdata:
